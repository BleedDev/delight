<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Evi</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <div class="titlebar" data-tauri-drag-region>
        <span class="titlebar-name" data-tauri-drag-region>Evi Setup</span>
        <button class="titlebar-button" id="minimize" type="button" aria-label="Minimize">
            <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6h8" /></svg>
        </button>
        <button class="titlebar-button close" id="close" type="button" aria-label="Close">
            <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" /></svg>
        </button>
    </div>

    <main>
        <header class="brand">
            <img class="logo" src="logo.svg" alt="" width="52" height="52">
            <div>
                <h1>Evi</h1>
                <p class="subtitle">Discord client mod <span class="version" id="version"></span></p>
            </div>
        </header>

        <div class="banner" id="banner" role="status" hidden>
            <span class="banner-text" id="banner-text"></span>
            <button class="button small" id="banner-install" type="button"></button>
        </div>

        <section class="view" id="choose">
            <h2 class="section-label" id="installs-label">Your Discord</h2>
            <div class="installs" id="installs" role="group" aria-labelledby="installs-label">
                <div class="installs-loading">Looking for Discord…</div>
            </div>
            <p class="hint" id="hint">Discord closes and opens again while Evi installs.</p>
            <div class="actions">
                <button class="button secondary" id="uninstall" type="button" disabled>Uninstall Evi</button>
                <button class="button primary" id="install" type="button" disabled>Install Evi</button>
            </div>
        </section>

        <section class="view status-view" id="working" hidden>
            <div class="status-icon" id="status-icon" aria-hidden="true"></div>
            <h2 class="status-title" id="status-title"></h2>
            <p class="status-text" id="status-text" role="status"></p>
            <ul class="outcomes" id="outcomes"></ul>
            <div class="actions" id="status-actions" hidden>
                <button class="button secondary" id="back" type="button">Back</button>
                <button class="button primary" id="finish" type="button">Close</button>
            </div>
        </section>
    </main>
</body>
</html>
