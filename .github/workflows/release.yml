# Builds the installers (evi.exe, macOS and Linux, Evi Setup for all three), tests them and publishes
# the release. Evi Setup for macOS and Linux builds on those systems (setup-builds.yml), alongside the
# Windows job; the release is published once every build and test passed.
# Its notes come from the version's entry in src/shared/changelog.ts (scripts/release-notes.ts), so
# there's nothing to write or press on GitHub. Evi's Updates tab, `evi update`, Evi Setup and
# evi.rest's releases and download pages all pick it up from there by themselves.
#
# A version with a dash (v0.5.0-beta.1) is published as a prerelease that never becomes "Latest":
# only people who turned on beta versions (or run `evi update --beta`) get it.
#
# Run it from the Actions tab with a version, or push a tag: git tag v0.2.0 && git push origin v0.2.0
# Either way the version has to match package.json, since that's what the exe reports, and have an
# entry in src/shared/changelog.ts: the run stops before building without one.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 (must match package.json)"
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  setup:
    uses: ./.github/workflows/setup-builds.yml

  release:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::\"$version\" isn't a version like 1.2.3"
            exit 1
          fi
          pkg_version=$(bun -e 'console.log(require("./package.json").version)')
          if [ "$pkg_version" != "$version" ]; then
            echo "::error::package.json says $pkg_version but this release is $version. Bump package.json first."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      # The release's notes, from its entry in src/shared/changelog.ts: fails right away without one
      - run: bun scripts/release-notes.ts "${{ steps.version.outputs.version }}" > notes.md && cat notes.md

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx tsc --noEmit
      - run: bun test
      - run: bun scripts/test-cli.ts

      # Re-signs the cross-compiled macOS installers, see the README
      - name: Install rcodesign
        run: |
          curl -sSL https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign/0.29.0/apple-codesign-0.29.0-x86_64-pc-windows-msvc.zip -o rcodesign.zip
          unzip -q rcodesign.zip -d rcodesign
          echo "RCODESIGN=$(find "$PWD/rcodesign" -name rcodesign.exe)" >> "$GITHUB_ENV"

      # Evi Setup (installer/, Rust + Tauri) builds with the runner's Rust; this keeps its crates between runs
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: installer

      # Every installer and its .sha256, plus evi-core.json (what Evi Setup downloads) and Evi-Setup.exe.
      # Bun downloads the other systems' runtimes and moves them
      # into its cache; on the runner the checkout is on D: and the cache and temp on C:, and those
      # moves fail ("Failed to extract executable"). Keep all of it on the checkout's drive.
      - run: bun scripts/build.ts --release --installer
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-cache
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      - run: bun scripts/test-cli.ts --exe
      - run: bun scripts/test-installer.ts
      - run: cat dist/*.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          # Named one by one: evi-linux-* would also match the .sha256 files
          path: |
            dist/evi.exe
            dist/evi-macos-arm64
            dist/evi-macos-x64
            dist/evi-linux-x64
            dist/evi-linux-arm64
            dist/evi-core.json
            dist/Evi-Setup.exe
            dist/*.sha256
            notes.md
          if-no-files-found: error

  # Published straight away: everything in both jobs built and tested what's uploaded
  publish:
    needs: [release, setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::A release or draft for $TAG already exists. Delete it first to rebuild."
            exit 1
          fi
          flags=(--latest)
          if [[ "$VERSION" == *-* ]]; then flags=(--prerelease --latest=false); fi
          cd out
          # The Windows job's files arrive in dist/ (its upload kept the folder next to notes.md)
          if [ -d dist ]; then mv dist/* . && rmdir dist; fi
          ls -l
          # The CLI files stay for Evi up to 1.3.1, which won't update from a release without them
          gh release create "$TAG" evi.exe evi-macos-{arm64,x64} evi-linux-{x64,arm64} evi-core.json             Evi-Setup.exe Evi-Setup-macos.zip Evi-Setup-linux-{x64,arm64} *.sha256             "${flags[@]}"             --target "$GITHUB_SHA"             --title "Evi $VERSION"             --notes-file notes.md
