# Builds evi.exe and attaches it to a DRAFT release. Nothing is ever published automatically:
# a maintainer reviews the draft on GitHub and presses "Publish release", which is what
# `evi update` picks up (it only sees published, non-prerelease releases).
#
# Run it from the Actions tab with a version, or push a tag: git tag v0.2.0 && git push origin v0.2.0
# Either way the version has to match package.json, since that's what the exe reports.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 (must match package.json)"
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::\"$version\" isn't a version like 1.2.3"
            exit 1
          fi
          pkg_version=$(bun -e 'console.log(require("./package.json").version)')
          if [ "$pkg_version" != "$version" ]; then
            echo "::error::package.json says $pkg_version but this release is $version. Bump package.json first."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx tsc --noEmit
      - run: bun test
      - run: bun scripts/test-cli.ts
      - run: bun scripts/build.ts --cli
      - run: bun scripts/test-cli.ts --exe

      - name: Checksum
        working-directory: dist
        run: |
          hash=$(sha256sum evi.exe | cut -d' ' -f1)
          printf '%s  evi.exe\n' "$hash" > evi.exe.sha256
          cat evi.exe.sha256

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::A release or draft for $TAG already exists. Delete it first to rebuild."
            exit 1
          fi
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" dist/evi.exe dist/evi.exe.sha256 \
            --draft "${prerelease[@]}" \
            --target "$GITHUB_SHA" \
            --title "Evi $VERSION" \
            --generate-notes
