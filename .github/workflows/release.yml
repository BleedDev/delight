# Builds the installers (evi.exe, macOS and Linux) and attaches them to a DRAFT release. Nothing is ever published automatically:
# a maintainer reviews the draft on GitHub and presses "Publish release", which is what
# `evi update` picks up (it only sees published, non-prerelease releases).
#
# A version with a dash (v0.5.0-beta.1) is drafted as a prerelease that never becomes "Latest":
# only people who turned on beta versions (or run `evi update --beta`) get it.
#
# Run it from the Actions tab with a version, or push a tag: git tag v0.2.0 && git push origin v0.2.0
# Either way the version has to match package.json, since that's what the exe reports.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 (must match package.json)"
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::\"$version\" isn't a version like 1.2.3"
            exit 1
          fi
          pkg_version=$(bun -e 'console.log(require("./package.json").version)')
          if [ "$pkg_version" != "$version" ]; then
            echo "::error::package.json says $pkg_version but this release is $version. Bump package.json first."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx tsc --noEmit
      - run: bun test
      - run: bun scripts/test-cli.ts

      # Re-signs the cross-compiled macOS installers, see the README
      - name: Install rcodesign
        run: |
          curl -sSL https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign/0.29.0/apple-codesign-0.29.0-x86_64-pc-windows-msvc.zip -o rcodesign.zip
          unzip -q rcodesign.zip -d rcodesign
          echo "RCODESIGN=$(find "$PWD/rcodesign" -name rcodesign.exe)" >> "$GITHUB_ENV"

      # Evi Setup (installer/, Rust + Tauri) builds with the runner's Rust; this keeps its crates between runs
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: installer

      # Every installer and its .sha256, plus evi-core.json (what Evi Setup downloads) and Evi-Setup.exe.
      # Bun downloads the other systems' runtimes and moves them
      # into its cache; on the runner the checkout is on D: and the cache and temp on C:, and those
      # moves fail ("Failed to extract executable"). Keep all of it on the checkout's drive.
      - run: bun scripts/build.ts --release --installer
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-cache
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      - run: bun scripts/test-cli.ts --exe
      - run: bun scripts/test-installer.ts
      - run: cat dist/*.sha256

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::A release or draft for $TAG already exists. Delete it first to rebuild."
            exit 1
          fi
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease --latest=false); fi
          # Named one by one: evi-linux-* would also match the .sha256 files, uploading them twice
          gh release create "$TAG" dist/evi.exe dist/evi-macos-{arm64,x64} dist/evi-linux-{x64,arm64} dist/evi-core.json dist/Evi-Setup.exe dist/*.sha256 \
            --draft "${prerelease[@]}" \
            --target "$GITHUB_SHA" \
            --title "Evi $VERSION" \
            --generate-notes
